<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="three.min.js"></script></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Hulk block 06 as a 3D layout for Seedance "Edit video": 10 s, hard cuts at 3.5 s and 7.0 s.
// Shot 1: jammed highway, hero in a tiny yellow hatchback, ambulance stuck behind, angry driver honks.
// Shot 2: close-up in the hatchback, hands on the wheel turn green, the wheel bends.
// Shot 3: the green giant lifts the two cars blocking the middle and sets them aside; the ambulance drives through.
const W = 1280, H = 720, cv = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
R.setSize(W, H, false); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3d9a0); scene.fog = new THREE.Fog(0xf3d9a0, 40, 140);
const cam = new THREE.PerspectiveCamera(45, W / H, 0.05, 300);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7 }, o));
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a7a60, 0.75));
const sun = new THREE.DirectionalLight(0xffe2b0, 0.9); sun.position.set(-20, 30, 15); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 120 }); scene.add(sun);
const add = (geo, mat, x, y, z, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };

// road: lanes along z, cars face +z (toward camera)
add(new THREE.BoxGeometry(22, 0.2, 260), M(0x8c8a84), 0, -0.1, -100);
for (let x of [-5.5, 0, 5.5]) for (let z = 10; z > -200; z -= 8) add(new THREE.BoxGeometry(0.25, 0.02, 3), M(0xf2f2e8), x, 0.01, z);
add(new THREE.BoxGeometry(0.8, 1, 260), M(0x9c9a92), -11.4, 0.5, -100); add(new THREE.BoxGeometry(0.8, 1, 260), M(0x9c9a92), 11.4, 0.5, -100);
// overpass + skyline
add(new THREE.BoxGeometry(60, 1.6, 4), M(0xb8a990), 0, 9, -70); [-8, 8].forEach(x => add(new THREE.BoxGeometry(1.6, 9, 1.6), M(0xb0a088), x, 4.5, -70));
for (let i = 0; i < 18; i++) add(new THREE.BoxGeometry(5, 12 + (i * 7) % 22, 5), M(0xc9b28a), -45 + i * 5.3, (12 + (i * 7) % 22) / 2, -150);

function car(x, z, col, opt = {}) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const L = opt.len || 4.2, Wd = opt.w || 1.9, Hb = opt.h || 0.9;
  add(new THREE.BoxGeometry(Wd, Hb, L), M(col, { roughness: 0.4 }), 0, 0.55 + Hb / 2, 0, g);
  if (!opt.van) add(new THREE.BoxGeometry(Wd * 0.88, 0.75, L * 0.5), M(col, { roughness: 0.4 }), 0, 0.55 + Hb + 0.37, -0.15 * L, g);
  else add(new THREE.BoxGeometry(Wd, 1.4, L * 0.78), M(col, { roughness: 0.4 }), 0, 0.55 + Hb + 0.7, -0.1 * L, g);
  const glass = M(0x2a3440, { roughness: 0.15 });
  add(new THREE.BoxGeometry(Wd * 0.8, 0.6, 0.05), glass, 0, 0.55 + Hb + 0.4, opt.van ? 0.29 * L : 0.1 * L + 0.02, g).rotation.x = -0.3;
  [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sz]) => { const w = add(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16), M(0x1a1a1a), sx * Wd / 2, 0.4, sz * L * 0.32, g); w.rotation.z = Math.PI / 2; });
  [-1, 1].forEach(s => add(new THREE.BoxGeometry(0.3, 0.2, 0.05), M(0xfff6d0, { emissive: 0x554422 }), s * Wd * 0.33, 0.9, L / 2 + 0.01, g));
  return g;
}
// lanes x: -8.2, -2.7, 2.7, 8.2
const cols = [0x5f8f8a, 0xc9a94a, 0x6a7da0, 0xb85a3c, 0x9aa0a6, 0x7d8f6a, 0xd08a4a, 0x5a6a7a];
const lanes = [-8.2, -2.7, 2.7, 8.2];
const blockL = car(-2.7, -14, 0x9aa0a6), blockR = car(2.7, -14.6, 0xb85a3c);
const hero = car(2.7, -2, 0xffcc22, { len: 3.4, w: 1.7, h: 0.8 });           // the tiny yellow hatchback
const angry = car(8.2, -1.2, 0x3c6ea8);                                     // angry driver
lanes.forEach((x, li) => { for (let k = 0; k < 14; k++) { const z = -2 - k * 6.2 - (li % 2) * 2.5; if (Math.abs(z + 14) < 3 && Math.abs(x) < 3) continue; if (li === 2 && k === 0) continue; if (li === 3 && k === 0) continue; if (Math.abs(x) < 3 && z < -18 && z > -40) continue; if (Math.abs(x) < 3 && z < -2 && z > -12.5) continue; car(x, z, cols[(li * 5 + k) % cols.length], { van: (li + k) % 6 === 0 }); } });
// truck far left
car(-8.2, -40, 0xe8e2d4, { van: true, len: 7, h: 1.2 });
// ambulance in the gap between middle lanes, behind the two blocking cars
const amb = car(0, -26, 0xffffff, { van: true, len: 5.2, h: 1.1 });
add(new THREE.BoxGeometry(2.0, 0.25, 5.25), M(0xd02020), 0, 1.35, 0, amb);
const sirenR = add(new THREE.BoxGeometry(0.4, 0.25, 0.4), M(0xff2020, { emissive: 0xff0000 }), -0.4, 3.0, 0.4, amb);
const sirenB = add(new THREE.BoxGeometry(0.4, 0.25, 0.4), M(0x2050ff, { emissive: 0x0030ff }), 0.4, 3.0, 0.4, amb);

// mannequins: hero in the hatchback (head + shoulders), angry driver (cap), giant
function head(parent, x, y, z, skin, hair, glasses, cap) {
  const h = add(new THREE.SphereGeometry(0.33, 24, 16), M(skin), x, y, z, parent);
  if (hair) add(new THREE.SphereGeometry(0.36, 16, 10, 0, Math.PI * 2, 0, 1.3), M(hair), x, y + 0.08, z - 0.03, parent);
  if (glasses) add(new THREE.BoxGeometry(0.42, 0.09, 0.05), M(0x111111), x, y + 0.03, z + 0.32, parent);
  if (cap) { add(new THREE.SphereGeometry(0.35, 16, 8, 0, Math.PI * 2, 0, 1.2), M(cap), x, y + 0.1, z, parent); add(new THREE.BoxGeometry(0.4, 0.04, 0.3), M(cap), x, y + 0.2, z + 0.35, parent); }
  return h;
}
hero.children[1].material = M(0xffcc22, { transparent: true, opacity: 0.35 });
head(hero, 0.35, 1.72, -0.5, 0xe8b48a, 0xd2691e, true).scale.setScalar(0.85);
add(new THREE.BoxGeometry(0.7, 0.4, 0.4), M(0x9a9a9a), 0.35, 1.35, -0.5, hero);
const angryHead = head(angry, 0.4, 2.1, -0.3, 0xd06a50, null, false, 0x2a2a6a);
const angryArm = add(new THREE.BoxGeometry(0.18, 0.18, 0.7), M(0x3a5aa0), 0.0, 1.75, 0.1, angry);

// giant
const giant = new THREE.Group(); scene.add(giant);
const gskin = M(0x5aa83a), gshirt = M(0x9a9a9a), gpants = M(0x8a8a8a);
const gt = add(new THREE.BoxGeometry(2.6, 2.4, 1.4), gshirt, 0, 4.2, 0, giant);
head(giant, 0, 6.0, 0, 0x5aa83a, 0xd2691e, true).scale.setScalar(2.1);
const legs = [-0.6, 0.6].map(x => add(new THREE.BoxGeometry(0.9, 3.0, 1.0), gpants, x, 1.5, 0, giant));
const arm = s => { const p = new THREE.Group(); p.position.set(s * 1.7, 5.0, 0); giant.add(p); add(new THREE.BoxGeometry(0.9, 2.6, 0.9), gskin, 0, -1.3, 0, p); add(new THREE.SphereGeometry(0.6, 16, 12), gskin, 0, -2.7, 0, p); return p; };
const gArmL = arm(-1), gArmR = arm(1);

// interior set for the close-up (far away from the road, its own little cabin)
const cab = new THREE.Group(); cab.position.set(200, 0, 0); scene.add(cab);
add(new THREE.BoxGeometry(4, 0.6, 1.2), M(0x2a2a2e), 0, 1.0, -0.6, cab);                // dashboard
add(new THREE.BoxGeometry(4, 1.6, 0.05), M(0xf0d8a0, { emissive: 0x806030 }), 0, 2.2, -1.4, cab);  // windshield light (traffic outside)
for (let i = -2; i <= 2; i++) add(new THREE.BoxGeometry(0.7, 0.4, 0.05), M(cols[(i + 5) % cols.length]), i * 0.8, 1.75, -1.38, cab);
const col = add(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 12), M(0x222222), 0, 1.4, -0.3, cab); col.rotation.x = 1.1;
const wheelGeo = new THREE.TorusGeometry(0.42, 0.05, 12, 48); const wheelPos0 = wheelGeo.attributes.position.array.slice();
const wheel = add(wheelGeo, M(0x1c1c1c), 0, 1.65, 0.05, cab); wheel.rotation.x = -0.45;
const handMat = M(0xe8b48a);
const hands = [-1, 1].map(s => add(new THREE.SphereGeometry(0.11, 16, 12), handMat, s * 0.42, 1.65, 0.12, cab));
hands.forEach((h, i) => add(new THREE.BoxGeometry(0.12, 0.12, 0.6), M(0x9a9a9a), (i ? 1 : -1) * 0.5, 1.5, 0.45, cab));
const inHead = head(cab, 0.25, 2.35, 0.7, 0xe8b48a, 0xd2691e, true); const glassFog = add(new THREE.BoxGeometry(0.42, 0.09, 0.02), M(0xffffff, { transparent: true, opacity: 0 }), 0.25, 2.38, 1.03, cab);

const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
window.renderAt = t => {
  const flash = Math.floor(t * 6) % 2;
  sirenR.material.emissive.setHex(flash ? 0xff0000 : 0x200000); sirenB.material.emissive.setHex(flash ? 0x000820 : 0x0030ff);
  angryArm.rotation.x = Math.sin(t * 14) * 0.3; angryHead.position.y = 2.1 + Math.abs(Math.sin(t * 7)) * 0.05;
  giant.visible = t >= 7; amb.position.z = -26;
  if (t < 3.5) { // shot 1: wide, slow push-in from above the hatchback
    const k = t / 3.5; cam.fov = 45; cam.position.set(4 - k * 0.6, 7 - k * 0.8, 12 - k * 1.5); cam.lookAt(0.5, 1.5, -18);
  } else if (t < 7) { // shot 2: close-up in the cabin
    const k = (t - 3.5) / 3.5; cam.fov = 40; cam.position.set(201.5, 2.05, 1.6); cam.lookAt(200.1, 1.8, 0.2);
    const g = ease((k - 0.15) / 0.5);
    handMat.color.setRGB(0.91 - 0.56 * g, 0.71 - 0.05 * g, 0.54 - 0.31 * g);
    inHead.material.color.copy(handMat.color); glassFog.material.opacity = 0.85 * ease((k - 0.4) / 0.4);
    const b = ease((k - 0.25) / 0.6), p = wheelGeo.attributes.position.array;   // bend: the wheel folds up at both grips and sags in the middle
    for (let i = 0; i < p.length; i += 3) { const x = wheelPos0[i], y = wheelPos0[i + 1]; p[i] = x * (1 - 0.25 * b); p[i + 1] = y - b * (0.35 * Math.cos(x * 3.7) - 0.1) ; p[i + 2] = wheelPos0[i + 2] + b * 0.25 * Math.sin(x * 4); }
    wheelGeo.attributes.position.needsUpdate = true; wheelGeo.computeVertexNormals();
    hands.forEach((h, i) => { h.position.y = 1.65 - b * 0.12; h.position.x = (i ? 1 : -1) * (0.42 - 0.1 * b); });
  } else { // shot 3: wide low angle, giant lifts both cars aside, ambulance passes
    const k = (t - 7) / 3; cam.fov = 48; cam.position.set(6.5 - k * 1.0, 7.5, 3.5); cam.lookAt(-0.5, 3.0, -14);
    giant.position.set(0, 0, -10.2);
    const lift = ease(k / 0.45), aside = ease((k - 0.35) / 0.35);
    gArmL.rotation.z = -0.4 - 0.9 * lift + 0.3 * aside; gArmR.rotation.z = 0.4 + 0.9 * lift - 0.3 * aside;
    blockL.position.set(-2.7 - 3.2 * aside, 4.0 * lift * (1 - aside), -14); blockL.rotation.z = 0.5 * lift * (1 - aside);
    blockR.position.set(2.7 + 3.2 * aside, 4.0 * lift * (1 - aside), -14.6); blockR.rotation.z = -0.5 * lift * (1 - aside);
    giant.position.x = 0; legs[0].position.x = -0.6 - 0.25 * lift; legs[1].position.x = 0.6 + 0.25 * lift;
    if (k > 0.62) { giant.position.x = -2.2 * ease((k - 0.62) / 0.15); }
    amb.position.z = -26 + 19 * ease((k - 0.62) / 0.38);
  }
  cam.updateProjectionMatrix(); R.render(scene, cam);
};
window.ready = Promise.resolve(true);
</script></body></html>
