<title>Михалыч, сколько стоит?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: спокойный отчёт в одну колонку: шапка → анкета → вывод с цифрами → шкала цен → причины по единой схеме → план → мастеру */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface2:#f6f7f9; --ink:#16191f; --ink2:#454c59; --muted:#6b7280;
  --line:#e3e6eb; --line2:#d2d7de; --accent:#1d5fd0; --accent-soft:#e8f0fc; --on-accent:#ffffff;
  --top:#e46f1a; --top-soft:#fdf0e6; --top-ink:#9a4508; --grid:#eceff3; --range2:#b3bdca;
  --s-parts:#2a78d6; --s-labor:#eb6834; --s-extra:#1baf7a;
  --good:#0ca30c; --warn:#d99a00; --crit:#d03b3b;
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1217; --surface:#171b22; --surface2:#1d222a; --ink:#e9ebef; --ink2:#b9bfca; --muted:#8c94a3;
  --line:#262c35; --line2:#343b46; --accent:#6aa3f5; --accent-soft:#1c2a40; --on-accent:#0f1217;
  --top:#f08c42; --top-soft:#3a2616; --top-ink:#f6b07a; --grid:#222831; --range2:#4b5566;
  --s-parts:#3987e5; --s-labor:#d95926; --s-extra:#199e70;
  --good:#3fbf55; --warn:#f0b53c; --crit:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#171b22; --surface2:#1d222a; --ink:#e9ebef; --ink2:#b9bfca; --muted:#8c94a3;
  --line:#262c35; --line2:#343b46; --accent:#6aa3f5; --accent-soft:#1c2a40; --on-accent:#0f1217;
  --top:#f08c42; --top-soft:#3a2616; --top-ink:#f6b07a; --grid:#222831; --range2:#4b5566;
  --s-parts:#3987e5; --s-labor:#d95926; --s-extra:#199e70;
  --good:#3fbf55; --warn:#f0b53c; --crit:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:16px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
h1,h2,h3{font-weight:600;margin:0;text-wrap:balance;line-height:1.25;letter-spacing:-.01em}
h1{font-size:clamp(24px,5.5vw,30px)}
h1 em{font-style:normal;color:var(--top)}
h2{font-size:17px}
h3{font-size:16px}
.lead{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;padding-bottom:4px}
.lead img{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);display:block;max-width:100%}
.bubble{margin:4px 0 0;color:var(--ink2);max-width:62ch}
form{display:grid;gap:20px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
legend{font-weight:600;font-size:17px;padding:0;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-weight:500;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,.chip input:focus-visible+span,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group{display:grid;gap:6px;min-width:0}
.group p{margin:0;font-weight:500;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:5px 11px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);font-size:14px;color:var(--ink2);cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--line2);border-radius:10px;padding:10px 16px;background:var(--surface);color:var(--ink)}
button.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;padding:11px 20px}
button:disabled{opacity:.55;cursor:default}
.status{margin:0;color:var(--muted);font-size:14px;min-height:1.4em}
.status.err{color:var(--crit);font-weight:500}
.out{display:grid;gap:16px}
.tag{display:inline-block;font-weight:500;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.tag.ex{background:var(--top-soft);color:var(--top-ink);border-color:transparent}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.num{font-variant-numeric:tabular-nums}
.verdict{display:grid;gap:16px}
.vtop{display:grid;grid-template-columns:84px minmax(0,1fr);gap:18px;align-items:start}
.car svg{width:100%;height:auto;display:block;max-width:100%}
.car .body{fill:var(--surface2);stroke:var(--ink2);stroke-width:1.5}
.car .wheel{fill:var(--line2)}
.car .zone{fill:var(--top)}
.car .zone-soft{fill:var(--top);opacity:.18}
.car .detail{fill:none;stroke:var(--line2);stroke-width:1.5}
.car .lbl{fill:var(--muted);font:500 11px var(--font)}
.car figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:2px;line-height:1.3}
.sum{font-weight:500;font-size:18px;line-height:1.45;margin:0;text-wrap:pretty}
.scale{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.scale li{border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.scale li i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--line2);font-size:0}
.scale li.on{color:var(--ink);font-weight:600}
.scale li.on.ok{border-color:var(--good)} .scale li.on.ok i{background:var(--good)}
.scale li.on.soon{border-color:var(--warn)} .scale li.on.soon i{background:var(--warn)}
.scale li.on.stop{border-color:var(--crit)} .scale li.on.stop i{background:var(--crit)}
.urgtext{margin:0;color:var(--ink2);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border-radius:10px;padding:10px 12px;display:grid;gap:1px;background:var(--surface2);min-width:0}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-size:19px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile small{font-size:12px;color:var(--ink2);overflow-wrap:anywhere;line-height:1.35}
.tile.hi{background:var(--top-soft)} .tile.hi b{color:var(--ink)}
.rc{position:relative;display:grid;gap:14px;padding-top:22px}
.rc-grid{position:absolute;inset:22px 0 24px 0;pointer-events:none}
.rc-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.rc-lim{position:absolute;top:0;height:16px;border-left:2px dashed var(--crit);pointer-events:none}
.rc-lim span{position:absolute;top:-1px;white-space:nowrap;font-size:12px;font-weight:500;color:var(--ink2);padding:0 4px}
.rc-tick{position:absolute;top:-3px;height:16px;border-left:2px dashed var(--crit)}
.rc-row{position:relative;z-index:1;display:grid;gap:4px}
@media (max-width:460px){.rc-axis span.odd{display:none}}
.rc-lab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;font-size:14px}
.rc-lab b{font-weight:500;background:var(--surface);padding-right:4px}
.rc-lab span{color:var(--ink2);font-variant-numeric:tabular-nums;background:var(--surface);padding-left:4px}
.rc-track{position:relative;height:10px}
.rc-bar{position:absolute;top:0;height:10px;border-radius:4px;background:var(--range2);min-width:6px}
.rc-bar.top{background:var(--top)}
.rc-axis{position:relative;height:16px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rc-axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.rc-axis span:first-child{transform:none}
.rc-axis span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.cause{display:grid;gap:14px}
.cause-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.rank{font-size:13px;font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--ink2);margin-top:1px}
.cause.top .rank{background:var(--top);border-color:var(--top);color:#fff}
.prob{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin-top:6px}
.prob i{display:block;height:6px;border-radius:999px;background:var(--grid);overflow:hidden}
.prob i s{display:block;height:100%;background:var(--range2);border-radius:999px}
.cause.top .prob i s{background:var(--top)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trio div{padding:9px 12px;display:grid;gap:1px;min-width:0;border-left:1px solid var(--line)}
.trio div:first-child{border-left:0}
.trio div.main{background:var(--surface2)}
.trio span{font-size:12px;color:var(--muted)}
.trio b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.trio small{font-size:12px;color:var(--muted)}
@media (max-width:460px){.trio div{padding:8px 9px}.trio b{font-size:14px}.trio span,.trio small{font-size:11px}}
.stack{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.stack i{display:block;height:100%}
.facts{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:8px 16px;margin:0}
.facts dt{font-size:13px;color:var(--muted);padding-top:1px}
.facts dd{margin:0;font-size:15px}
@media (max-width:460px){.facts{grid-template-columns:minmax(0,1fr);gap:2px}.facts dt{margin-top:8px}}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.rows{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;font-size:15px;border-top:1px solid var(--line);padding-top:6px}
.rows li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.rows small{display:block;color:var(--muted);font-size:13px}
.plan{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.plan li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;counter-increment:s}
.plan li::before{content:counter(s);font-size:13px;font-weight:600;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2)}
.plan .who{display:inline-block;font-size:12px;color:var(--muted);margin-right:6px}
.plan b{font-weight:500}
.plan p{margin:2px 0 0;color:var(--muted);font-size:14px}
.plan b.cost{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:460px){.plan li{grid-template-columns:28px minmax(0,1fr)}.plan b.cost{grid-column:2}}
.box{display:grid;gap:10px}
.box p{margin:0}
.limit{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.say{display:grid;gap:6px;margin:0;padding-left:20px}
.qs{display:grid;gap:10px}
.qs ul{margin:0;padding-left:20px;display:grid;gap:4px}
.assume{display:flex;flex-wrap:wrap;gap:6px}
.foot{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="lead">
    <img src="avatar.jpg" alt="Михалыч" width="48" height="48">
    <div>
      <h1>Михалыч, <em>сколько стоит?</em></h1>
      <p class="bubble">Опиши поломку — покажу вероятные причины, цену ремонта в твоём городе и что сказать мастеру.</p>
    </div>
  </header>

  <form id="f" class="st" autocomplete="off">
    <fieldset>
      <legend>Машина</legend>
      <div class="grid">
        <label class="f">Марка<input id="make" list="makes" required value="Lada"></label>
        <label class="f">Модель<input id="model" required value="Granta"></label>
        <label class="f">Год<input id="year" type="number" inputmode="numeric" min="1980" max="2027" required value="2017"></label>
        <label class="f">Пробег, км<input id="km" type="number" inputmode="numeric" min="0" step="1000" value="118000"></label>
        <label class="f">Мотор<input id="engine" placeholder="например, 1.6 8 кл." value="1.6 8 клапанов"></label>
        <label class="f">Коробка<select id="gear"><option>механика</option><option>автомат</option><option>вариатор</option><option>робот</option><option value="">не знаю</option></select></label>
        <label class="f">Город<input id="city" list="cities" value="Казань"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Что беспокоит</legend>
      <div class="group"><p>Что</p><div class="chips" data-name="what"></div></div>
      <div class="group"><p>Где</p><div class="chips" data-name="where"></div></div>
      <div class="group"><p>Когда</p><div class="chips" data-name="when"></div></div>
      <label class="f">Своими словами<textarea id="text" placeholder="Что слышно или видно, с какого момента началось, что уже меняли">Глухо постукивает спереди справа, когда еду по брусчатке или лежачим полицейским. На ровной дороге тихо. Руль не тянет, при повороте ничего не хрустит.</textarea></label>
    </fieldset>

    <div class="actions">
      <button class="main" id="go" type="submit">Михалыч, сколько стоит?</button>
      <button id="stop" type="button" hidden>Остановить</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Разбор занимает от полуминуты до двух минут. Считает Claude на вашем аккаунте.</p>
  </form>

  <section class="out" id="out" aria-live="polite"></section>
</div>

<script>
const CHIPS = {
  what: ['Стук', 'Скрип', 'Гул или вой', 'Свист', 'Вибрация', 'Течь', 'Запах', 'Лампочка на приборке', 'Не заводится', 'Перегрев', 'Пинается коробка', 'Тянет в сторону', 'Плохо тянет', 'Другое'],
  where: ['Спереди', 'Сзади', 'Слева', 'Справа', 'Под капотом', 'Под днищем', 'В салоне', 'Колесо', 'Не знаю'],
  when: ['На кочках', 'В повороте', 'При торможении', 'При разгоне', 'На скорости', 'На холодную', 'На горячую', 'На холостых', 'При переключении', 'Всегда'],
};
const PRESET = { what: ['Стук'], where: ['Спереди', 'Справа'], when: ['На кочках'] };
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
};
const sv = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};
for (const box of document.querySelectorAll('.chips')) {
  const name = box.dataset.name;
  CHIPS[name].forEach((t, i) => {
    const id = `${name}-${i}`;
    const inp = el('input', { type: 'checkbox', id, value: t });
    if (PRESET[name].includes(t)) inp.checked = true;
    box.append(el('label', { class: 'chip', for: id }, inp, el('span', { text: t })));
  });
}
const picked = name => [...document.querySelectorAll(`.chips[data-name="${name}"] input:checked`)].map(i => i.value);
const N = v => Number(v) || 0;
const r100 = n => Math.round(N(n) / 100) * 100;
const fmt = n => r100(n).toLocaleString('ru-RU').replace(/ |,/g, ' ');
const rub = n => fmt(n) + ' ₽';
const range = (a, b) => (r100(a) === r100(b) ? rub(a) : `${fmt(a)}–${fmt(b)} ₽`);
const compact = n => (n >= 1000 ? (n / 1000).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' тыс.' : String(n));
const URG = [['ok', '', 'Можно ездить'], ['soon', '', 'Не тяни с ремонтом'], ['stop', '', 'Не езди']];
const CONF = { low: 'Уверенность низкая', medium: 'Уверенность средняя', high: 'Уверенность высокая' };
const DIY = { yes: 'можно самому', hard: 'самому сложно', no: 'только сервис' };

function caseText(extra) {
  const v = id => $(id).value.trim();
  const lines = [
    `Машина: ${v('make')} ${v('model')}, ${v('year') || 'год не указан'} год, мотор: ${v('engine') || 'не указан'}, коробка: ${v('gear') || 'не указана'}.`,
    `Пробег: ${v('km') ? Number(v('km')).toLocaleString('ru-RU') + ' км' : 'не указан'}. Город: ${v('city') || 'не указан'}.`,
    `Что беспокоит: ${picked('what').join(', ') || 'не отмечено'}. Где: ${picked('where').join(', ') || 'не отмечено'}. Когда: ${picked('when').join(', ') || 'не отмечено'}.`,
    `Своими словами: «${v('text') || 'нет'}»`,
  ];
  if (extra) lines.push(`Уточнения от владельца: ${extra}`);
  return lines.join('\n');
}

/* схема машины сверху: подсвечиваем, где беспокоит */
function carDiagram(where) {
  const w = new Set(where);
  const fig = el('figure', { class: 'car', style: 'margin:0' });
  const s = sv('svg', { viewBox: '0 0 160 270', role: 'img', 'aria-label': 'Схема машины сверху: где беспокоит' });
  s.append(sv('text', { x: 80, y: 12, 'text-anchor': 'middle', class: 'lbl' }, 'перёд'));
  const front = w.has('Спереди'), rear = w.has('Сзади'), left = w.has('Слева'), right = w.has('Справа');
  const rows = front && !rear ? ['F'] : rear && !front ? ['R'] : ['F', 'R'];
  const sides = left && !right ? ['L'] : right && !left ? ['R'] : ['L', 'R'];
  const wheelOn = (front || rear || left || right || w.has('Колесо'));
  const WH = { F: 62, R: 186 }, WX = { L: 17, R: 129 };
  // мягкая подсветка зон кузова
  if (w.has('Под капотом')) s.append(sv('rect', { x: 34, y: 22, width: 92, height: 62, rx: 26, class: 'zone-soft' }));
  if (w.has('В салоне')) s.append(sv('rect', { x: 38, y: 98, width: 84, height: 86, rx: 10, class: 'zone-soft' }));
  if (w.has('Под днищем')) s.append(sv('rect', { x: 46, y: 40, width: 68, height: 200, rx: 12, class: 'zone-soft' }));
  s.append(sv('rect', { x: 30, y: 20, width: 100, height: 230, rx: 34, class: 'body' }));
  s.append(sv('path', { d: 'M42 96 Q80 84 118 96 L114 120 Q80 112 46 120 Z', class: 'detail' }));
  s.append(sv('path', { d: 'M46 196 Q80 204 114 196 L116 214 Q80 224 44 214 Z', class: 'detail' }));
  for (const r of ['F', 'R']) for (const sd of ['L', 'R']) {
    const on = wheelOn && rows.includes(r) && sides.includes(sd);
    if (on) s.append(sv('circle', { cx: WX[sd] + 7, cy: WH[r] + 22, r: 20, class: 'zone-soft' }));
    s.append(sv('rect', { x: WX[sd], y: WH[r], width: 14, height: 44, rx: 5, class: on ? 'zone' : 'wheel' }));
  }
  if (w.has('Под капотом')) s.append(sv('rect', { x: 60, y: 40, width: 40, height: 26, rx: 6, class: 'zone' }));
  fig.append(s);
  const parts = [];
  if (front && !rear) parts.push('спереди'); if (rear && !front) parts.push('сзади');
  if (left && !right) parts.push('слева'); if (right && !left) parts.push('справа');
  ['Под капотом', 'Под днищем', 'В салоне'].forEach(z => w.has(z) && parts.push(z.toLowerCase()));
  fig.append(el('figcaption', { text: parts.length ? parts.join(', ') : 'место не указано' }));
  return fig;
}

/* шкала цен: вилка каждой причины на одной оси + порог «завышено» */
function niceMax(v) {
  const steps = [500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000, 100000];
  for (const st of steps) if (v / st <= 6) return { max: Math.ceil(v / st) * st, step: st };
  return { max: Math.ceil(v / 100000) * 100000, step: 100000 };
}
function rangeChart(causes, limit) {
  const top = Math.max(...causes.map(c => N(c.total_max)), N(limit)) * 1.04;
  const { max, step } = niceMax(top);
  const pct = v => Math.max(0, Math.min(100, N(v) / max * 100));
  const rc = el('div', { class: 'rc', role: 'img', 'aria-label': 'Вилки цен по причинам на одной шкале: ' + causes.map(c => `${c.name} ${range(c.total_min, c.total_max)}`).join('; ') });
  const grid = el('div', { class: 'rc-grid', 'aria-hidden': 'true' });
  const axis = el('div', { class: 'rc-axis', 'aria-hidden': 'true' });
  for (let t = 0; t <= max; t += step) {
    const g = el('i'); g.style.left = pct(t) + '%'; grid.append(g);
    const a = el('span', { text: compact(t), class: (Math.round(t / step) % 2) ? 'odd' : '' }); a.style.left = pct(t) + '%'; axis.append(a);
  }
  rc.append(grid);
  if (N(limit) > 0) {
    const lim = el('div', { class: 'rc-lim', 'aria-hidden': 'true' }); lim.style.left = pct(limit) + '%';
    const lab = el('span', { text: `дороже ${rub(limit)} — завышено` });
    if (pct(limit) > 55) { lab.style.right = '4px'; } else { lab.style.left = '4px'; }
    lim.append(lab); rc.append(lim);
  }
  causes.forEach((c, i) => {
    const p = Math.round(N(c.probability) * 100);
    const bar = el('i', { class: 'rc-bar' + (i === 0 ? ' top' : ''), title: `${c.name}: ${range(c.total_min, c.total_max)}, вероятность ${p}%` });
    bar.style.left = pct(c.total_min) + '%'; bar.style.width = Math.max(1, pct(c.total_max) - pct(c.total_min)) + '%';
    const track = el('div', { class: 'rc-track' }, bar);
    if (N(limit) > 0) { const tk = el('i', { class: 'rc-tick', 'aria-hidden': 'true' }); tk.style.left = pct(limit) + '%'; track.append(tk); }
    rc.append(el('div', { class: 'rc-row' }, el('div', { class: 'rc-lab' }, el('b', { text: `${i + 1}. ${c.name}` }), el('span', { text: `${range(c.total_min, c.total_max)} · ${p}%` })), track));
  });
  rc.append(axis);
  return rc;
}

function render(d, opts = {}) {
  const out = $('out'); out.replaceChildren();
  const causes = (Array.isArray(d.causes) ? d.causes : []).filter(c => c && c.name).slice(0, 4);
  const rate = d.labor_rate || {};
  const where = opts.where || picked('where');

  // 1. Вердикт: схема + вывод + шкала срочности + цифры
  const v = el('div', { class: 'st verdict' });
  const meta = el('div', { class: 'meta' });
  if (opts.example) meta.append(el('span', { class: 'tag ex', text: 'Пример разбора' }));
  if (CONF[d.confidence]) meta.append(el('span', { class: 'tag', text: CONF[d.confidence] }));
  const scale = el('ul', { class: 'scale', 'aria-label': 'Можно ли ездить' });
  URG.forEach(([k, ic, t]) => scale.append(el('li', { class: k + (d.urgency === k ? ' on' : '') }, el('i', { 'aria-hidden': 'true', text: ic }), t)));
  v.append(meta, el('div', { class: 'vtop' }, carDiagram(where), el('div', { style: 'display:grid;gap:12px;min-width:0' }, el('p', { class: 'sum', text: d.summary || '' }), scale, d.urgency_text ? el('p', { class: 'urgtext', text: d.urgency_text }) : null)));
  if (causes.length) {
    const sp = causes.reduce((a, c) => a + N(c.probability), 0) || 1;
    const expected = causes.reduce((a, c) => a + N(c.probability) * (N(c.total_min) + N(c.total_max)) / 2, 0) / sp;
    const worst = Math.max(...causes.map(c => N(c.total_max)));
    const svc = (d.plan || []).find(s => s.who === 'service' && N(s.cost_max) > 0);
    const tiles = el('div', { class: 'tiles' },
      el('div', { class: 'tile hi' }, el('span', { text: 'Скорее всего' }), el('b', { text: range(causes[0].total_min, causes[0].total_max) }), el('small', { text: causes[0].name })),
      el('div', { class: 'tile' }, el('span', { text: 'Ожидаемый счёт' }), el('b', { text: '≈ ' + rub(expected) }), el('small', { text: 'с учётом вероятностей' })),
      el('div', { class: 'tile' }, el('span', { text: 'Худший вариант' }), el('b', { text: 'до ' + rub(worst) }), el('small', { text: causes.find(c => N(c.total_max) === worst).name })),
      el('div', { class: 'tile' }, el('span', { text: 'Диагностика' }), el('b', { text: svc ? range(svc.cost_min, svc.cost_max) : '—' }), el('small', { text: 'начать с неё' })));
    v.append(tiles);
  }
  out.append(v);

  // 2. Шкала цен
  if (causes.length) {
    out.append(el('div', { class: 'st box' }, el('h2', {}, 'Сколько может стоить'),
      el('p', { class: 'foot', text: 'Ремонт в независимом сервисе, запчасти и работа. Оранжевым отмечена самая вероятная причина.' }),
      rangeChart(causes, d.overpay && d.overpay.limit)));
  }

  // 3. Карточки причин по одной схеме
  causes.forEach((c, i) => {
    const p = Math.max(0, Math.min(1, N(c.probability)));
    const parts = Array.isArray(c.parts) ? c.parts : [];
    const pMin = parts.reduce((a, x) => a + N(x.min), 0), pMax = parts.reduce((a, x) => a + N(x.max), 0);
    const lh = Array.isArray(c.labor_hours) ? c.labor_hours.map(N) : [0, 0];
    const lMin = lh[0] * N(rate.min), lMax = (lh[1] || lh[0]) * N(rate.max);
    const eMin = N(c.extra_min), eMax = N(c.extra_max);
    const card = el('article', { class: 'st cause' + (i === 0 ? ' top' : '') });
    const bar = el('i'); const fill = el('s'); fill.style.width = Math.round(p * 100) + '%'; bar.append(fill);
    card.append(el('div', { class: 'cause-h' }, el('span', { class: 'rank', text: String(i + 1) }),
      el('div', { style: 'min-width:0' }, el('h3', { text: c.name }), el('div', { class: 'prob' }, bar, el('span', { text: `вероятность ${Math.round(p * 100)}%` })))));
    card.append(el('div', { class: 'trio' },
      el('div', {}, el('span', { text: 'Сам, только запчасти' }), el('b', { text: c.diy === 'no' ? '—' : range(pMin, pMax) }), el('small', { text: DIY[c.diy] || '' })),
      el('div', { class: 'main' }, el('span', { text: 'Независимый сервис' }), el('b', { text: range(c.total_min, c.total_max) }), el('small', { text: 'запчасти и работа' })),
      el('div', {}, el('span', { text: 'Дилер' }), el('b', { text: N(c.dealer_total_max) ? range(c.dealer_total_min, c.dealer_total_max) : '—' }), el('small', { text: 'оригинал, ставка дилера' }))));
    // из чего складывается цена: середины вилок
    const segs = [['Запчасти', (pMin + pMax) / 2, 'var(--s-parts)', range(pMin, pMax)], ['Работа', (lMin + lMax) / 2, 'var(--s-labor)', range(lMin, lMax)], ['Дополнительно', (eMin + eMax) / 2, 'var(--s-extra)', range(eMin, eMax)]].filter(s => s[1] > 0);
    const tot = segs.reduce((a, s) => a + s[1], 0) || 1;
    const stack = el('div', { class: 'stack', role: 'img', 'aria-label': 'Из чего складывается цена: ' + segs.map(s => `${s[0]} ${s[3]}`).join(', ') });
    segs.forEach(s => { const it = el('i', { title: `${s[0]}: ${s[3]}` }); it.style.width = (s[1] / tot * 100) + '%'; it.style.background = s[2]; stack.append(it); });
    const leg = el('ul', { class: 'legend' }); segs.forEach(s => { const sw = el('i'); sw.style.background = s[2]; leg.append(el('li', {}, sw, `${s[0]} ${s[3]}`)); });
    card.append(el('div', { style: 'display:grid;gap:8px' }, el('span', { class: 'foot', text: 'Из чего складывается цена в сервисе' }), stack, leg));
    const facts = el('dl', { class: 'facts' });
    [['Почему так думаю', c.why], ['Как убедиться', c.confirm], ['Обычно бывает', c.typical_km ? `на пробеге ${c.typical_km}` : ''], ['Самому', c.diy_note], ['Если тянуть', c.if_delay]]
      .forEach(([k, t]) => { if (t) facts.append(el('dt', { text: k }), el('dd', { text: t })); });
    if (i === 0) card.append(facts);
    const rows = el('ul', { class: 'rows' });
    parts.forEach(x => rows.append(el('li', {}, el('span', {}, `${x.name || 'Запчасть'}${N(x.qty) > 1 ? ' × ' + N(x.qty) : ''}`, x.note ? el('small', { text: x.note }) : null), el('span', { text: range(x.min, x.max) }))));
    if (lh[0]) rows.append(el('li', {}, el('span', {}, 'Работа', el('small', { text: `${lh[0] === lh[1] || !lh[1] ? lh[0] : lh[0] + '–' + lh[1]} нормо-часа × ${range(rate.min, rate.max)}` })), el('span', { text: range(lMin, lMax) })));
    if (c.extra) rows.append(el('li', {}, el('span', { text: c.extra }), el('span', { text: eMax ? range(eMin, eMax) : '' })));
    if (i === 0) card.append(el('details', {}, el('summary', { text: 'Запчасти и работа подробно' }), rows));
    else card.append(el('details', {}, el('summary', { text: 'Признаки, пробег, запчасти и работа' }), facts, rows));
    out.append(card);
  });

  // 4. План по шагам
  if (Array.isArray(d.plan) && d.plan.length) {
    const ol = el('ol', { class: 'plan' });
    d.plan.forEach(s => ol.append(el('li', {}, el('div', { style: 'min-width:0' }, el('span', { class: 'who', text: s.who === 'self' ? 'Сам' : 'Сервис' }), el('b', { text: s.step || '' }), s.result ? el('p', { text: s.result }) : null),
      el('b', { class: 'cost', text: N(s.cost_max) ? range(s.cost_min, s.cost_max) : 'бесплатно' }))));
    out.append(el('div', { class: 'st box' }, el('h2', {}, 'План: от дешёвого к дорогому'), ol));
  }

  // 5. Мастеру
  if (d.overpay && d.overpay.text) out.append(el('div', { class: 'st box' }, el('h2', {}, 'Ориентир для сервиса'), el('p', { class: 'limit', text: d.overpay.text })));
  if (Array.isArray(d.say_to_master) && d.say_to_master.length) {
    const list = el('ol', { class: 'say' }); d.say_to_master.forEach(t => list.append(el('li', { text: t })));
    const copy = el('button', { type: 'button', id: 'copy-say' }, 'Скопировать фразы');
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(d.say_to_master.join('\n')); copy.textContent = 'Скопировано'; }
      catch { const r = document.createRange(); r.selectNodeContents(list); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = 'Выделено, скопируй вручную'; }
      setTimeout(() => (copy.textContent = 'Скопировать фразы'), 1800);
    });
    out.append(el('div', { class: 'st box' }, el('h2', {}, 'Что сказать мастеру'), list, el('div', { class: 'actions' }, copy)));
  }
  if (!opts.example && Array.isArray(d.questions) && d.questions.length) {
    const ul = el('ul'); d.questions.forEach(q => ul.append(el('li', { text: q })));
    const ta = el('textarea', { id: 'answers', placeholder: 'Ответь на вопросы — разбор станет точнее' });
    const again = el('button', { type: 'button', class: 'main', id: 'again' }, 'Пересчитать');
    again.addEventListener('click', () => ask(ta.value.trim()));
    out.append(el('div', { class: 'st qs' }, el('h2', {}, 'Уточни, чтобы было точнее'), ul, ta, el('div', { class: 'actions' }, again)));
  }
  // 6. Что учтено
  const as = el('div', { class: 'assume' });
  (opts.facts || [`${$('make').value} ${$('model').value}, ${$('year').value}`, $('km').value ? `${Number($('km').value).toLocaleString('ru-RU')} км` : '', $('city').value]).filter(Boolean).forEach(t => as.append(el('span', { class: 'tag', text: t })));
  if (rate.min) as.append(el('span', { class: 'tag', text: `нормо-час ${range(rate.min, rate.max)}` }));
  if (rate.dealer_min) as.append(el('span', { class: 'tag', text: `у дилера ${range(rate.dealer_min, rate.dealer_max)}` }));
  out.append(el('div', { class: 'box' }, as, el('p', { class: 'foot', text: `Это оценка по описанию, а не диагностика: точную причину покажет осмотр. Цены запчастей и ставки по городам — ориентир прототипа${rate.city_tier ? ' (' + rate.city_tier + ')' : ''}.` })));
}

let ctl = null;
const FAIL = {
  not_granted: 'Без разрешения на Claude разбор не посчитать. Его можно дать в меню страницы.',
  sampling_disabled: 'Claude недоступен на этом аккаунте.',
  rate_limited: 'Слишком много запросов подряд. Попробуй через пару минут.',
  session_expired: 'Нужно заново войти в аккаунт.',
  invalid_json: 'Ответ пришёл в неправильном виде. Нажми ещё раз.',
  refused: 'Claude не стал отвечать на такое описание. Переформулируй.',
  upstream_error: 'Связь прервалась. Нажми ещё раз.',
};
async function ask(extra) {
  const status = $('status'), go = $('go'), stop = $('stop');
  if (!$('make').value.trim() || !$('model').value.trim()) { status.className = 'status err'; status.textContent = 'Укажи марку и модель.'; return; }
  if (!picked('what').length && !$('text').value.trim()) { status.className = 'status err'; status.textContent = 'Отметь, что беспокоит, или опиши своими словами.'; return; }
  const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
  if (!sample) { status.className = 'status err'; status.textContent = 'Разбор работает, когда страница открыта в Claude.'; return; }
  ctl = new AbortController();
  go.disabled = true; stop.hidden = false; status.className = 'status'; status.textContent = 'Михалыч думает…';
  const again = $('again'); if (again) again.disabled = true;
  try {
    const d = await sample.json($('rules').textContent + '\n\nСлучай:\n' + caseText(extra), {
      modelTier: 'complex', signal: ctl.signal,
      onText: () => { status.textContent = 'Михалыч пишет разбор…'; },
    });
    if (!d || !Array.isArray(d.causes) || !d.causes.length) throw { code: 'invalid_json' };
    render(d);
    status.textContent = 'Готово.';
    const first = $('out').firstChild;
    if (first) first.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  } catch (e) {
    if (e && e.code === 'cancelled') { status.textContent = 'Остановлено.'; }
    else { status.className = 'status err'; status.textContent = FAIL[e && e.code] || FAIL.upstream_error; }
    if (again) again.disabled = false;
  } finally { go.disabled = false; stop.hidden = true; ctl = null; }
}
$('f').addEventListener('submit', e => { e.preventDefault(); ask(''); });
$('stop').addEventListener('click', () => ctl && ctl.abort());
try {
  const dc = JSON.parse($('demo-case').textContent);
  render(JSON.parse($('demo').textContent), { example: true, where: dc.where, facts: dc.facts });
} catch (e) { /* пример не загрузился — страница работает без него */ }
</script>
