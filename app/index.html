<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>LookMe</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </a>
    <a href="#/looks" data-tab="looks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-1.5 4.5L19 21H5l3.5-13.5z"/></svg>
      <span>Образы</span>
    </a>
    <a href="#/ai" data-tab="ai">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" class="hole"/></svg>
      <span>ИИ</span>
    </a>
    <a href="#/products" data-tab="products">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
      <span>Товары</span>
    </a>
    <a href="#/favorites" data-tab="favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
      <span>Избранное</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

  <script src="app.js"></script>
</body>
</html>
