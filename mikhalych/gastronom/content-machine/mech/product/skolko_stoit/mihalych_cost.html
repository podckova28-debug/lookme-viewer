<script type="text/plain" id="rules">Ты — Михалыч, механик с тридцатилетним стажем из «Гаража Михалыча». Человек описал, что не так с его машиной. Твоя задача — честно оценить, что скорее всего сломалось и сколько стоит ремонт в его городе сейчас (Россия, конец 2026 года), и дать план: с чего начать, можно ли ехать, что сказать мастеру и какая цена уже завышена.

Как думать:
1. Сначала разбери симптом: что, где, когда проявляется (на холодную/горячую, на кочках, в повороте, при торможении, на скорости, на холостых). Учитывай модель, мотор, коробку, год и пробег — у каждой модели свои типичные болячки.
2. Назови 2–4 вероятные причины, от самой вероятной к менее вероятной. Вероятности в долях (0.6 = 60%), сумма не больше 1. Если данных мало, вероятности ровнее, confidence = "low" и задай уточняющие вопросы.
3. Для каждой причины посчитай деньги:
   - запчасти: диапазон «аналог — оригинал» по ценам маркетплейсов и магазинов запчастей конца 2026 года именно для этой модели;
   - работа: нормо-часы по нормам производителя (диапазон), умноженные на ставку нормо-часа в городе (таблица ниже);
   - итог = запчасти + работа (+ расходники и сход-развал/прокачка, если без них нельзя). Округляй до сотен рублей.
4. План от дешёвого к дорогому: сначала что человек может проверить сам бесплатно, потом какая диагностика нужна (ходовая обычно 500–1 500 ₽, компьютерная 800–2 000 ₽, в Москве дороже), потом что делать по её результату. Не советуй менять детали наугад.
   Для каждой причины также: как убедиться, что это именно она (признак, который отличает её от остальных); на каком пробеге это обычно случается у этой модели; можно ли сделать самому (yes — справится любой с ключами, hard — нужен опыт и подъёмник, no — только сервис); сколько это стоит у официального дилера; что будет, если тянуть, и во сколько это выльется.
5. Безопасность важнее денег: тормоза, рулевое, запах бензина в салоне, перегрев, лампочка давления масла, сильная вибрация на скорости, течь тормозной жидкости — urgency = "stop" (не ехать или только до сервиса на малой скорости/на эвакуаторе, скажи как). Ничего, что связано с тормозами и рулём, не называй ерундой.
6. Порог переплаты: для самой вероятной причины назови сумму, выше которой счёт за этот ремонт в этом городе уже завышен (примерно верх вилки + 25%).
7. Фразы для мастера — вежливые, короткие, по делу: попросить показать старую деталь, смету до начала работ, согласовывать доп. работы.
8. Не выдумывай уверенность. Не придумывай редкие поломки, если есть частые. Говори простым языком, как опытный механик соседу, без жаргона и без англицизмов.
9. Пиши коротко, это читают с телефона: summary — до 20 слов; why, confirm, if_delay, diy_note, urgency_text — одно предложение до 20 слов; шаг плана — до 12 слов, его result — до 15 слов; фраза мастеру — до 15 слов; не повторяй одно и то же в разных полях.
10. Попутный ремонт. Когда узел снимают или разбирают, мастер почти всегда находит ещё что-то: при снятии коробки — сцепление и выжимной, вместе с колодками — диски, рядом с одним ШРУСом — второй и пыльники, при замене ступицы — ШРУС. Если это типично для причины, впиши попутную замену в extra с ценой: extra_min = 0, extra_max = её цена с работой.

  const scale = el('ul', { class: 'scale', 'aria-label': 'Можно ли ездить' });
  URG.forEach(([k, ic, t]) => scale.append(el('li', { class: k + (d.urgency === k ? ' on' : '') }, el('i', { 'aria-hidden': 'true', text: ic }), t)));
  v.append(meta, el('div', { class: 'vtop' }, carDiagram(where), el('div', { style: 'display:grid;gap:12px;min-width:0' }, el('p', { class: 'sum', text: d.summary || '' }), scale, d.urgency_text ? el('p', { class: 'urgtext', text: d.urgency_text }) : null)));
  if (causes.length) {
    const sp = causes.reduce((a, c) => a + N(c.probability), 0) || 1;
    const expected = causes.reduce((a, c) => a + N(c.probability) * (N(c.total_min) + N(c.total_max)) / 2, 0) / sp;
    const worst = Math.max(...causes.map(c => N(c.total_max)));
    const svc = (d.plan || []).find(s => s.who === 'service' && N(s.cost_max) > 0);
    const tiles = el('div', { class: 'tiles' },
      el('div', { class: 'tile hi' }, el('span', { text: 'Скорее всего' }), el('b', { text: range(causes[0].total_min, causes[0].total_max) }), el('small', { text: causes[0].name })),
      el('div', { class: 'tile' }, el('span', { text: 'Ожидаемый счёт' }), el('b', { text: '≈ ' + rub(expected) }), el('small', { text: 'с учётом вероятностей' })),
      el('div', { class: 'tile' }, el('span', { text: 'Худший вариант' }), el('b', { text: 'до ' + rub(worst) }), el('small', { text: causes.find(c => N(c.total_max) === worst).name })),
      el('div', { class: 'tile' }, el('span', { text: 'Диагностика' }), el('b', { text: svc ? range(svc.cost_min, svc.cost_max) : '—' }), el('small', { text: 'начать с неё' })));
    v.append(tiles);
  }
  out.append(v);

  // 2. Шкала цен
  if (causes.length) {
    out.append(el('div', { class: 'st box' }, el('h2', {}, 'Сколько может стоить'),
      el('p', { class: 'foot', text: 'Ремонт в независимом сервисе, запчасти и работа. Оранжевым отмечена самая вероятная причина.' }),
      rangeChart(causes, d.overpay && d.overpay.limit)));
  }

  // 3. Карточки причин по одной схеме
  causes.forEach((c, i) => {
    const p = Math.max(0, Math.min(1, N(c.probability)));
    const parts = Array.isArray(c.parts) ? c.parts : [];
    const pMin = parts.reduce((a, x) => a + N(x.min), 0), pMax = parts.reduce((a, x) => a + N(x.max), 0);
    const lh = Array.isArray(c.labor_hours) ? c.labor_hours.map(N) : [0, 0];
    const lMin = lh[0] * N(rate.min), lMax = (lh[1] || lh[0]) * N(rate.max);
    const eMin = N(c.extra_min), eMax = N(c.extra_max);
    const card = el('article', { class: 'st cause' + (i === 0 ? ' top' : '') });
    const bar = el('i'); const fill = el('s'); fill.style.width = Math.round(p * 100) + '%'; bar.append(fill);
    card.append(el('div', { class: 'cause-h' }, el('span', { class: 'rank', text: String(i + 1) }),
      el('div', { style: 'min-width:0' }, el('h3', { text: c.name }), el('div', { class: 'prob' }, bar, el('span', { text: `вероятность ${Math.round(p * 100)}%` })))));
    card.append(el('div', { class: 'trio' },
      el('div', {}, el('span', { text: 'Сам, только запчасти' }), el('b', { text: c.diy === 'no' ? '—' : range(pMin, pMax) }), el('small', { text: DIY[c.diy] || '' })),
      el('div', { class: 'main' }, el('span', { text: 'Независимый сервис' }), el('b', { text: range(c.total_min, c.total_max) }), el('small', { text: 'запчасти и работа' })),
      el('div', {}, el('span', { text: 'Дилер' }), el('b', { text: N(c.dealer_total_max) ? range(c.dealer_total_min, c.dealer_total_max) : '—' }), el('small', { text: 'оригинал, ставка дилера' }))));
    // из чего складывается цена: середины вилок
    const segs = [['Запчасти', (pMin + pMax) / 2, 'var(--s-parts)', range(pMin, pMax)], ['Работа', (lMin + lMax) / 2, 'var(--s-labor)', range(lMin, lMax)], ['Дополнительно', (eMin + eMax) / 2, 'var(--s-extra)', range(eMin, eMax)]].filter(s => s[1] > 0);
    const tot = segs.reduce((a, s) => a + s[1], 0) || 1;
    const stack = el('div', { class: 'stack', role: 'img', 'aria-label': 'Из чего складывается цена: ' + segs.map(s => `${s[0]} ${s[3]}`).join(', ') });
    segs.forEach(s => { const it = el('i', { title: `${s[0]}: ${s[3]}` }); it.style.width = (s[1] / tot * 100) + '%'; it.style.background = s[2]; stack.append(it); });
    const leg = el('ul', { class: 'legend' }); segs.forEach(s => { const sw = el('i'); sw.style.background = s[2]; leg.append(el('li', {}, sw, `${s[0]} ${s[3]}`)); });
    card.append(el('div', { style: 'display:grid;gap:8px' }, el('span', { class: 'foot', text: 'Из чего складывается цена в сервисе' }), stack, leg));
    const facts = el('dl', { class: 'facts' });
    [['Почему так думаю', c.why], ['Как убедиться', c.confirm], ['Обычно бывает', c.typical_km ? `на пробеге ${c.typical_km}` : ''], ['Самому', c.diy_note], ['Если тянуть', c.if_delay]]
      .forEach(([k, t]) => { if (t) facts.append(el('dt', { text: k }), el('dd', { text: t })); });
    if (i === 0) card.append(facts);
    const rows = el('ul', { class: 'rows' });
    parts.forEach(x => rows.append(el('li', {}, el('span', {}, `${x.name || 'Запчасть'}${N(x.qty) > 1 ? ' × ' + N(x.qty) : ''}`, x.note ? el('small', { text: x.note }) : null), el('span', { text: range(x.min, x.max) }))));
    if (lh[0]) rows.append(el('li', {}, el('span', {}, 'Работа', el('small', { text: `${lh[0] === lh[1] || !lh[1] ? lh[0] : lh[0] + '–' + lh[1]} нормо-часа × ${range(rate.min, rate.max)}` })), el('span', { text: range(lMin, lMax) })));
    if (c.extra) rows.append(el('li', {}, el('span', { text: c.extra }), el('span', { text: eMax ? range(eMin, eMax) : '' })));
    if (i === 0) card.append(el('details', {}, el('summary', { text: 'Запчасти и работа подробно' }), rows));
    else card.append(el('details', {}, el('summary', { text: 'Признаки, пробег, запчасти и работа' }), facts, rows));
    out.append(card);
  });

  // 4. План по шагам
  if (Array.isArray(d.plan) && d.plan.length) {
    const ol = el('ol', { class: 'plan' });
    d.plan.forEach(s => ol.append(el('li', {}, el('div', { style: 'min-width:0' }, el('span', { class: 'who', text: s.who === 'self' ? 'Сам' : 'Сервис' }), el('b', { text: s.step || '' }), s.result ? el('p', { text: s.result }) : null),
      el('b', { class: 'cost', text: N(s.cost_max) ? range(s.cost_min, s.cost_max) : 'бесплатно' }))));
    out.append(el('div', { class: 'st box' }, el('h2', {}, 'План: от дешёвого к дорогому'), ol));
  }

  // 5. Мастеру
  if (d.overpay && d.overpay.text) out.append(el('div', { class: 'st box' }, el('h2', {}, 'Ориентир для сервиса'), el('p', { class: 'limit', text: d.overpay.text })));
  if (Array.isArray(d.say_to_master) && d.say_to_master.length) {
    const list = el('ol', { class: 'say' }); d.say_to_master.forEach(t => list.append(el('li', { text: t })));
    const copy = el('button', { type: 'button', id: 'copy-say' }, 'Скопировать фразы');
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(d.say_to_master.join('\n')); copy.textContent = 'Скопировано'; }
      catch { const r = document.createRange(); r.selectNodeContents(list); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = 'Выделено, скопируй вручную'; }
      setTimeout(() => (copy.textContent = 'Скопировать фразы'), 1800);
    });
    out.append(el('div', { class: 'st box' }, el('h2', {}, 'Что сказать мастеру'), list, el('div', { class: 'actions' }, copy)));
  }
  if (!opts.example && Array.isArray(d.questions) && d.questions.length) {
    const ul = el('ul'); d.questions.forEach(q => ul.append(el('li', { text: q })));
    const ta = el('textarea', { id: 'answers', placeholder: 'Ответь на вопросы — разбор станет точнее' });
    const again = el('button', { type: 'button', class: 'main', id: 'again' }, 'Пересчитать');
    again.addEventListener('click', () => ask(ta.value.trim()));
    out.append(el('div', { class: 'st qs' }, el('h2', {}, 'Уточни, чтобы было точнее'), ul, ta, el('div', { class: 'actions' }, again)));
  }
  // 6. Что учтено
  const as = el('div', { class: 'assume' });
  (opts.facts || [`${$('make').value} ${$('model').value}, ${$('year').value}`, $('km').value ? `${Number($('km').value).toLocaleString('ru-RU')} км` : '', $('city').value]).filter(Boolean).forEach(t => as.append(el('span', { class: 'tag', text: t })));
  if (rate.min) as.append(el('span', { class: 'tag', text: `нормо-час ${range(rate.min, rate.max)}` }));
  if (rate.dealer_min) as.append(el('span', { class: 'tag', text: `у дилера ${range(rate.dealer_min, rate.dealer_max)}` }));
  out.append(el('div', { class: 'box' }, as, el('p', { class: 'foot', text: `Это оценка по описанию, а не диагностика: точную причину покажет осмотр. Цены запчастей и ставки по городам — ориентир прототипа${rate.city_tier ? ' (' + rate.city_tier + ')' : ''}.` })));
}

let ctl = null;
const FAIL = {
  not_granted: 'Без разрешения на Claude разбор не посчитать. Его можно дать в меню страницы.',
  sampling_disabled: 'Claude недоступен на этом аккаунте.',
  rate_limited: 'Слишком много запросов подряд. Попробуй через пару минут.',
  session_expired: 'Нужно заново войти в аккаунт.',
  invalid_json: 'Ответ пришёл в неправильном виде. Нажми ещё раз.',
  refused: 'Claude не стал отвечать на такое описание. Переформулируй.',
  upstream_error: 'Связь прервалась. Нажми ещё раз.',
};
async function ask(extra) {
  const status = $('status'), go = $('go'), stop = $('stop');
  if (!$('make').value.trim() || !$('model').value.trim()) { status.className = 'status err'; status.textContent = 'Укажи марку и модель.'; return; }
  if (!picked('what').length && !$('text').value.trim()) { status.className = 'status err'; status.textContent = 'Отметь, что беспокоит, или опиши своими словами.'; return; }
  const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
  if (!sample) { status.className = 'status err'; status.textContent = 'Разбор работает, когда страница открыта в Claude.'; return; }
  ctl = new AbortController();
  go.disabled = true; stop.hidden = false; status.className = 'status'; status.textContent = 'Михалыч думает…';
  const again = $('again'); if (again) again.disabled = true;
  try {
    const d = await sample.json($('rules').textContent + '\n\nСлучай:\n' + caseText(extra), {
      modelTier: 'complex', signal: ctl.signal,
      onText: () => { status.textContent = 'Михалыч пишет разбор…'; },
    });
    if (!d || !Array.isArray(d.causes) || !d.causes.length) throw { code: 'invalid_json' };
    render(d);
    status.textContent = 'Готово.';
    const first = $('out').firstChild;
    if (first) first.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  } catch (e) {
    if (e && e.code === 'cancelled') { status.textContent = 'Остановлено.'; }
    else { status.className = 'status err'; status.textContent = FAIL[e && e.code] || FAIL.upstream_error; }
    if (again) again.disabled = false;
  } finally { go.disabled = false; stop.hidden = true; ctl = null; }
}
$('f').addEventListener('submit', e => { e.preventDefault(); ask(''); });
$('stop').addEventListener('click', () => ctl && ctl.abort());
try {
  const dc = JSON.parse($('demo-case').textContent);
  render(JSON.parse($('demo').textContent), { example: true, where: dc.where, facts: dc.facts });
} catch (e) { /* пример не загрузился — страница работает без него */ }
</script>
