<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bangers;src:url("fonts/Bangers-Regular.ttf")}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Code-drawn cartoon scene, style after simple "what if" explainer cartoons:
   flat shapes, thin dark outline, warm rim light from the window, letterbox. */
const C=document.getElementById('c'),X=C.getContext('2d');
const W=1920,H=1080, OUT='#1b1320', LW=5, RIM='rgba(255,226,168,.95)', BAR=72;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const io=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};          // ease in-out
const back=t=>{t=clamp(t);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}; // ease out with overshoot
const R=(t,a,b,f=io)=>f((t-a)/(b-a));
const mix=(a,b,u)=>a+(b-a)*u;
const bump=(t,a,b)=>Math.max(0,Math.sin(clamp((t-a)/(b-a))*Math.PI));

/* ---------- drawing helpers ---------- */
function rrPath(g,x,y,w,h,r){g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shape(g,path,fill,lw=LW){g.beginPath();path(g);if(fill){g.fillStyle=fill;g.fill();}if(lw){g.lineWidth=lw;g.strokeStyle=OUT;g.lineJoin='round';g.stroke();}}
function tube(pts,col,w){X.lineCap='round';X.lineJoin='round';X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));
  X.strokeStyle=OUT;X.lineWidth=w+2*LW;X.stroke();X.strokeStyle=col;X.lineWidth=w;X.stroke();}
function ik(sx,sy,tx,ty,L1,L2,out){let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);const m=L1+L2-1;if(d>m){tx=sx+dx/d*m;ty=sy+dy/d*m;d=m}
  const b=Math.atan2(ty-sy,tx-sx),o=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const e1=[sx+L1*Math.cos(b+o),sy+L1*Math.sin(b+o)],e2=[sx+L1*Math.cos(b-o),sy+L1*Math.sin(b-o)];
  return [(out>0)===(e1[0]>e2[0])?e1:e2,[tx,ty]];}
function rimClip(path,fromX,col=RIM,w=10){X.save();X.beginPath();path(X);X.clip();X.beginPath();X.rect(fromX,0,W,H);X.clip();
  X.beginPath();path(X);X.strokeStyle=col;X.lineWidth=w;X.stroke();X.restore();}
function shadeClip(path,toX,col){X.save();X.beginPath();path(X);X.clip();X.fillStyle=col;X.fillRect(0,0,toX,H);X.restore();}
function mitten(x,y,r){shape(X,g=>g.arc(x,y,r,0,7),'#f1ece6');X.beginPath();X.arc(x,y,r-5,-1.2,0.2);X.strokeStyle=RIM;X.lineWidth=4;X.stroke();}

/* ---------- background (rendered once, plus a blurred copy for close-ups) ---------- */
let BG,BGB;
function buildBG(){
  const b=document.createElement('canvas');b.width=W;b.height=H;const g=b.getContext('2d');
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#3d2f47');gr.addColorStop(.6,'#4a3a52');gr.addColorStop(1,'#3a2e44');g.fillStyle=gr;g.fillRect(0,0,W,H);
  // window: dusk sky, sun with rays, skyline with water towers and lit windows
  const wx=1120,wy=120,ww=760,wh=430;
  g.save();g.beginPath();g.rect(wx,wy,ww,wh);g.clip();
  gr=g.createLinearGradient(0,wy,0,wy+wh);gr.addColorStop(0,'#3e3156');gr.addColorStop(.5,'#8a5d7c');gr.addColorStop(.85,'#e7a26a');gr.addColorStop(1,'#f7cf8a');g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);
  const sx=wx+520,sy=wy+wh-34;g.globalAlpha=.16;g.fillStyle='#ffe7b0';
  for(let i=0;i<9;i++){const a=-Math.PI*0.95+i*Math.PI*0.11;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.cos(a-0.035)*900,sy+Math.sin(a-0.035)*900);g.lineTo(sx+Math.cos(a+0.035)*900,sy+Math.sin(a+0.035)*900);g.fill();}
  g.globalAlpha=1;g.fillStyle='#ffe8b4';g.beginPath();g.arc(sx,sy,46,Math.PI,0);g.fill();
  const rnd=(s=>()=> (s=(s*16807)%2147483647)/2147483647)(11);
  for(const [col,base,hmin,hmax] of [['#5a456c',0,60,170],['#45344f',0,110,250]]){
    for(let x=wx-20;x<wx+ww;){const bw=50+rnd()*90,bh=hmin+rnd()*(hmax-hmin),by=wy+wh-bh;g.fillStyle=col;g.fillRect(x,by,bw,bh);
      if(rnd()<.35){g.fillRect(x+bw*.3,by-26,22,26);g.fillRect(x+bw*.3+4,by-34,14,8);}                // water tower
      g.fillStyle='rgba(255,214,140,.85)';for(let yy=by+14;yy<wy+wh-8;yy+=20)for(let xx=x+8;xx<x+bw-8;xx+=15)if(rnd()<.28)g.fillRect(xx,yy,6,8);
      x+=bw+(col==='#5a456c'?30:6);}}
  g.restore();
  g.strokeStyle=OUT;g.lineWidth=14;g.strokeRect(wx,wy,ww,wh);g.lineWidth=9;g.beginPath();g.moveTo(wx+ww/2,wy);g.lineTo(wx+ww/2,wy+wh);g.moveTo(wx,wy+wh*.38);g.lineTo(wx+ww,wy+wh*.38);g.stroke();
  // warm light spill from the window
  gr=g.createRadialGradient(wx+ww*.6,wy+wh,30,wx+ww*.6,wy+wh,1100);gr.addColorStop(0,'rgba(255,190,120,.20)');gr.addColorStop(1,'rgba(255,190,120,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  // upper cabinets with brass handles
  for(let i=0;i<4;i++){const x=40+i*262;shape(g,q=>rrPath(q,x,96,240,268,6),'#564460',4);g.fillStyle='#e0b45c';rrPath2(g,x+212,212,9,40,4);}
  // counter and lower cabinets
  shape(g,q=>q.rect(-10,604,W+20,30),'#6e5670',4);
  shape(g,q=>q.rect(-10,634,W+20,310),'#4c3c55',4);
  for(let i=0;i<8;i++){const x=24+i*240;shape(g,q=>rrPath(q,x,660,218,246,6),'#53425c',4);g.fillStyle='#e0b45c';rrPath2(g,x+90,684,40,9,4);}
  // kettle and a potted plant on the counter
  shape(g,q=>{rrPath(q,360,520,104,86,26)},'#9a8796',4);shape(g,q=>q.rect(394,504,36,18),'#7d6a7a',4);
  shape(g,q=>q.rect(1640,556,70,50),'#a8644a',4);for(const [dx,dy,r] of [[-14,-14,26],[16,-22,28],[2,-40,24]])shape(g,q=>q.arc(1675+dx,556+dy,r,0,7),'#4d7a52',4);
  // floor
  gr=g.createLinearGradient(0,944,0,H);gr.addColorStop(0,'#2e2536');gr.addColorStop(1,'#211a28');g.fillStyle=gr;g.fillRect(0,944,W,H-944);
  g.strokeStyle=OUT;g.lineWidth=4;g.beginPath();g.moveTo(0,944);g.lineTo(W,944);g.stroke();
  BG=b;
  BGB=document.createElement('canvas');BGB.width=W;BGB.height=H;const h=BGB.getContext('2d');h.filter='blur(7px)';h.drawImage(b,0,0);
}
function rrPath2(g,x,y,w,h,r){g.beginPath();rrPath(g,x,y,w,h,r);g.fill();}

/* ---------- heads ---------- */
function head(cx,cy,r,rot,o){
  X.save();X.translate(cx,cy);X.rotate(rot);
  const circ=g=>g.arc(0,0,r,0,7);
  shape(X,circ,'#cbc3cd',0);
  X.save();X.beginPath();circ(X);X.clip();X.fillStyle='#ece8ee';X.beginPath();X.arc(r*.13,-r*.09,r,0,7);X.fill();X.restore();
  X.beginPath();X.arc(0,0,r-6,-1.35,0.35);X.strokeStyle=RIM;X.lineWidth=6;X.stroke();          // rim light from the window (right)
  shape(X,circ,null);
  if(o.hair){for(const[a,b,s]of[[-.72,-.52,.3],[-.5,-.78,.31],[-.16,-.92,.31],[.2,-.9,.3],[.52,-.76,.3],[.76,-.5,.28],[-.88,-.2,.24],[.88,-.18,.22],[-.3,-.68,.26],[.06,-.7,.26],[.38,-.62,.25]])
      shape(X,g=>g.arc(a*r,b*r,s*r,0,7),'#1f1719',4);
    X.strokeStyle='#463638';X.lineWidth=4;for(const[a,b]of[[-.5,-.8],[.2,-.92],[.62,-.72]]){X.beginPath();X.arc(a*r,b*r,r*.13,3.6,5.2);X.stroke();}}
  if(o.beard){shape(X,g=>{g.moveTo(-r*.94,-r*.06);g.quadraticCurveTo(-r*.9,r*1.0,0,r*1.12);g.quadraticCurveTo(r*.9,r*1.0,r*.94,-r*.06);
      g.quadraticCurveTo(r*.6,r*.2,0,r*.22);g.quadraticCurveTo(-r*.6,r*.2,-r*.94,-r*.06);},'#2c201d');
    X.strokeStyle='#54403a';X.lineWidth=4;for(const s of[-1,1]){X.beginPath();X.arc(s*r*.42,r*.55,r*.18,s>0?3.4:4.6,s>0?4.8:6);X.stroke();}
    X.strokeStyle='#e7d9c9';X.lineWidth=5;X.lineCap='round';X.beginPath();X.moveTo(-r*.13,r*.44);X.lineTo(r*.13,r*.44);X.stroke();
    X.fillStyle='rgba(255,255,255,.55)';X.beginPath();X.ellipse(r*.32,-r*.6,r*.16,r*.07,-.5,0,7);X.fill();}    // bald shine
  const [lx,ly]=o.look||[0,0], ex=r*.33, ey=-r*.04;
  for(const s of[-1,1]){const x=s*ex+lx,y=ey+ly,bl=o.blink||0;
    X.fillStyle=OUT;X.strokeStyle=OUT;X.lineCap='round';
    if(bl>.8){X.lineWidth=5;X.beginPath();X.arc(x,y-r*.03,r*.1,.2*Math.PI,.8*Math.PI);X.stroke();}
    else{X.beginPath();X.ellipse(x,y,r*.075,r*.1*(1-bl*.9),0,0,7);X.fill();
      if(o.lid>0){X.fillStyle=o.beard?'#e6e1e7':'#ece8ee';X.fillRect(x-r*.1,y-r*.13,r*.2,r*.13*o.lid*1.3);X.lineWidth=4;X.beginPath();X.moveTo(x-r*.1,y-r*.13+r*.13*o.lid*1.3);X.lineTo(x+r*.1,y-r*.13+r*.13*o.lid*1.3);X.stroke();}}
    if(o.brow){X.lineWidth=5;X.beginPath();const by=ey-r*.28,k=o.brow*s;X.moveTo(x-r*.12,by-k*r*.05);X.lineTo(x+r*.12,by+k*r*.05);X.stroke();}}
  if(o.glasses){X.strokeStyle=OUT;X.lineWidth=5;for(const s of[-1,1]){X.beginPath();X.arc(s*ex,ey,r*.23,0,7);X.stroke();}
    X.beginPath();X.moveTo(-ex+r*.23,ey);X.quadraticCurveTo(0,ey-r*.06,ex-r*.23,ey);X.stroke();
    X.strokeStyle='rgba(255,255,255,.6)';X.lineWidth=3;for(const s of[-1,1]){X.beginPath();X.arc(s*ex,ey,r*.17,-1.1,-.5);X.stroke();}}
  if(!o.beard){const m=o.mouth||0,my=r*.42,w=r*.2;X.strokeStyle=OUT;X.lineWidth=5;X.lineCap='round';
    X.beginPath();X.moveTo(-w,my-m*r*.04);X.quadraticCurveTo(0,my+m*r*.2,w,my-m*r*.04);X.stroke();}
  X.restore();
}

/* ---------- hero: curly hair, mustard hoodie ---------- */
function hero(t,p){
  const gx=1235, gy=944, br=Math.sin(t*2.2)*2.5;                  // breathing
  const lift=p.inhale*7-p.slump*12, top=gy-460-br+lift*-1*-1;      // shoulders line
  const Y='#e4ae3c', Yd='#bf8a24', LEG='#efe6d6';
  for(const dx of[-30,30]){tube([[gx+dx,gy-200],[gx+dx,gy-12]],LEG,16);shape(X,g=>g.ellipse(gx+dx+(dx>0?8:-8),gy-8,22,10,0,0,7),'#e2d8c6',4);}
  // far arm (screen left), behind the body
  let [e,h]=ik(gx-92,top+46,gx-112,gy-212-p.slump*6,108,104,-1); tube([[gx-92,top+46],e,h],Yd,34); mitten(h[0],h[1],18);
  // torso
  const torso=g=>{g.moveTo(gx-100,top+34);g.quadraticCurveTo(gx-104,top+4,gx-70,top);g.lineTo(gx+70,top);g.quadraticCurveTo(gx+104,top+4,gx+100,top+34);
    g.lineTo(gx+104,gy-208);g.quadraticCurveTo(gx+104,gy-196,gx+90,gy-196);g.lineTo(gx-90,gy-196);g.quadraticCurveTo(gx-104,gy-196,gx-104,gy-208);g.closePath();};
  shape(X,torso,Y,0); shadeClip(torso,gx-62,'rgba(150,100,20,.35)'); rimClip(torso,gx+50); shape(X,torso,null);
  shape(X,g=>{g.moveTo(gx-56,top+2);g.lineTo(gx,top+52);g.lineTo(gx+56,top+2);},Yd,4);                 // hood V
  shape(X,g=>{g.moveTo(gx-58,gy-288);g.lineTo(gx+58,gy-288);g.lineTo(gx+72,gy-226);g.lineTo(gx-72,gy-226);g.closePath();},'rgba(0,0,0,.08)',4); // pocket
  // neck + head
  const hx=gx+p.headX, hy=top-100+p.headDrop;
  tube([[gx,top+4],[hx,hy+80]],LEG,13);
  head(hx,hy,100,p.headRot,{hair:1,blink:p.blink,mouth:p.mouth,look:p.look,brow:p.brow,lid:p.lid});
  // near arm (screen right) with the finger
  [e,h]=ik(gx+92,top+46,p.hand[0],p.hand[1],108,104,1); tube([[gx+92,top+46],e,h],Y,36);
  if(p.raise>.35){
    const fx=h[0]+2, fy=h[1]-30;
    shape(X,g=>rrPath(g,fx-9,fy-6,18,34,9),'#f1ece6',4);                      // index finger
    shape(X,g=>rrPath(g,fx-11,fy-22,22,24,8),'#c23a32',4);                    // red cap
    shape(X,g=>g.rect(fx-11,fy-2,22,6),'#e3b44c',3);                         // gold band
    mitten(h[0],h[1],20);
    const gl=p.glow, cx=fx, cy=fy-12;
    X.save();X.globalCompositeOperation='lighter';
    let gr=X.createRadialGradient(cx,cy,1,cx,cy,22+70*gl);gr.addColorStop(0,`rgba(150,225,255,${.55+.45*gl})`);gr.addColorStop(1,'rgba(60,150,255,0)');
    X.fillStyle=gr;X.beginPath();X.arc(cx,cy,22+70*gl,0,7);X.fill();
    if(p.ring>0){X.strokeStyle=`rgba(170,230,255,${(1-p.ring)*.9})`;X.lineWidth=5;X.beginPath();X.arc(cx,cy,20+p.ring*90,0,7);X.stroke();}
    X.restore();X.fillStyle='#effbff';X.beginPath();X.arc(cx,cy,5,0,7);X.fill();
  } else mitten(h[0],h[1],20);
}

/* ---------- Dave: bald, beard, round glasses, navy bathrobe, plaid pants, mug ---------- */
function dave(t,p){
  const gx=665, gy=944, br=Math.sin(t*1.7+1)*2.5, top=gy-520-br;
  const N='#2c3d6e', Nd='#1f2c52', Nl='#5d70a3';
  for(const dx of[-46,46]){
    const leg=g=>rrPath(g,gx+dx-26,gy-200,52,196,14);
    shape(X,leg,'#3e5a95',0);X.save();X.beginPath();leg(X);X.clip();X.strokeStyle='#7192cc';X.lineWidth=4;
    for(let y=gy-196;y<gy;y+=24){X.beginPath();X.moveTo(gx+dx-30,y);X.lineTo(gx+dx+30,y);X.stroke();}
    for(let x=gx+dx-14;x<gx+dx+30;x+=20){X.beginPath();X.moveTo(x,gy-200);X.lineTo(x,gy);X.stroke();}X.restore();shape(X,leg,null);
    shape(X,g=>g.ellipse(gx+dx+(dx>0?10:-10),gy-6,40,13,0,0,7),'#25233c',4);}
  let [e,h]=ik(gx-124,top+60,gx-150,gy-250,124,118,-1); tube([[gx-124,top+60],e,h],Nd,46); mitten(h[0],h[1],22);
  const robe=g=>{g.moveTo(gx-132,top+52);g.quadraticCurveTo(gx-130,top+10,gx-80,top+4);g.lineTo(gx+80,top+4);g.quadraticCurveTo(gx+130,top+10,gx+132,top+52);
    g.lineTo(gx+150,gy-178);g.quadraticCurveTo(gx+150,gy-164,gx+134,gy-164);g.lineTo(gx-134,gy-164);g.quadraticCurveTo(gx-150,gy-164,gx-150,gy-178);g.closePath();};
  shape(X,robe,N,0); shadeClip(robe,gx-80,'rgba(10,15,40,.35)'); rimClip(robe,gx+70); shape(X,robe,null);
  shape(X,g=>{g.moveTo(gx-48,top+6);g.lineTo(gx,top+140);g.lineTo(gx+48,top+6);},'#8e8b98',4);                         // gray t-shirt
  shape(X,g=>{g.moveTo(gx-62,top+6);g.lineTo(gx-46,top+6);g.lineTo(gx+10,top+214);g.lineTo(gx-6,top+214);g.closePath();},Nl,4);   // lapels
  shape(X,g=>{g.moveTo(gx+62,top+6);g.lineTo(gx+46,top+6);g.lineTo(gx+2,top+170);g.lineTo(gx-8,top+150);g.closePath();},Nl,4);
  shape(X,g=>g.rect(gx-146,gy-330,292,30),Nd,4); shape(X,g=>rrPath(g,gx+34,gy-336,30,98,10),Nl,4);                        // belt + tail
  const hx=gx+p.headRot*-60, hy=top-112;
  tube([[gx,top+6],[hx,hy+90]],'#efe6d6',14);
  head(hx,hy,114,p.headRot,{beard:1,glasses:1,blink:p.blink,look:[5,0],lid:p.lid});
  // near arm with the mug: chest -> mouth
  const tx=mix(gx+70,gx+70,p.lift), ty=mix(top+178,hy+70,p.lift);
  [e,h]=ik(gx+124,top+60,tx,ty,124,118,1); tube([[gx+124,top+60],e,h],N,46);
  X.save();X.translate(h[0]-40,h[1]-10);X.rotate(-0.42*p.lift);
  shape(X,g=>rrPath(g,-32,-40,64,76,12),'#f4f1ea');X.beginPath();X.arc(-32,-2,22,1.5,4.7);X.lineWidth=12;X.strokeStyle=OUT;X.stroke();X.lineWidth=6;X.strokeStyle='#f4f1ea';X.stroke();
  X.fillStyle='#6b4a36';X.beginPath();X.ellipse(0,-38,26,6,0,0,7);X.fill();X.restore();
  mitten(h[0],h[1],23);
  if(p.steam>0){X.strokeStyle=`rgba(255,255,255,${.4*p.steam})`;X.lineWidth=5;X.lineCap='round';
    for(const d of[-12,10]){X.beginPath();for(let i=0;i<7;i++){const yy=h[1]-56-i*13,xx=h[0]-40+d+Math.sin(t*3.5+i*.9+d)*7;i?X.lineTo(xx,yy):X.moveTo(xx,yy);}X.stroke();}}
}

function caption(text,a,y=104){if(a<=0)return;X.save();X.globalAlpha=a;X.font='70px Bangers';const w=X.measureText(text).width,s=.9+.1*back(a);
  X.translate(70,y);X.scale(s,s);X.fillStyle='#fde047';X.strokeStyle='#141014';X.lineWidth=8;X.beginPath();rrPath(X,0,0,w+56,100,8);X.fill();X.stroke();
  X.fillStyle='#141014';X.fillText(text,28,77);X.restore();}

/* ---------- shots and timeline ---------- */
const SHOTS=[{a:0,b:1.75,cx:950,cy:575,z:1.04,dz:.025},
             {a:1.75,b:4.6,cx:1290,cy:505,z:1.62,dz:.06,blur:1},
             {a:4.6,b:8.2,cx:935,cy:575,z:1.08,dz:.03}];
const blinkAmt=(t,list)=>Math.max(0,...list.map(b=>bump(t,b,b+.16)));
window.render=function(t){
  if(!BG)buildBG();
  const s=SHOTS.find(s=>t>=s.a&&t<s.b)||SHOTS[SHOTS.length-1];
  const z=s.z+s.dz*clamp((t-s.a)/(s.b-s.a)), drift=Math.sin(t*.6)*4;
  X.setTransform(1,0,0,1,0,0);X.fillStyle='#000';X.fillRect(0,0,W,H);
  X.setTransform(z,0,0,z,W/2-s.cx*z+drift,H/2-s.cy*z);
  X.drawImage(s.blur?BGB:BG,0,0);
  // hero beats: anticipation dip, raise with overshoot, two pulses, inhale, sigh
  const raise=R(t,.85,1.45,back)*(1-R(t,3.85,4.55));
  const ant=bump(t,.7,.9);
  // hand travels on a wide arc (almost straight arm) between rest and raised
  const P0=[1235+112,944-208],P1=[1235+300,944-430],P2=[1235+214,944-556], u=raise, v=1-u;
  const hand=[v*v*P0[0]+2*u*v*P1[0]+u*u*P2[0], v*v*P0[1]+2*u*v*P1[1]+u*u*P2[1]+ant*10];
  const p1=bump(t,2.0,2.35), p2=bump(t,2.62,2.97);
  const inhale=bump(t,3.45,3.85), slump=R(t,3.8,4.5);
  const sad=R(t,3.3,4.1);
