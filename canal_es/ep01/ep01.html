<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Bangers;src:url("../anim/fonts/Bangers-Regular.ttf")}@font-face{font-family:ComicNeue;src:url("../anim/fonts/ComicNeue-Bold.ttf")}html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../anim/lib.js"></script><script src="../anim/sets.js"></script><script src="timing.js"></script>
<script src="scenes1.js"></script><script src="scenes2.js"></script><script src="scenes3.js"></script>
<script>
const X = document.getElementById('c').getContext('2d');
SID = new URLSearchParams(location.search).get('scene') || 's01';
window.render = t => { X.setTransform(1,0,0,1,0,0); X.filter='none'; X.globalAlpha=1; SC[SID](X, t); };
window.ready = Promise.all([document.fonts.load('70px Bangers'), document.fonts.load('70px ComicNeue')]).then(() => true);
</script></body></html>
