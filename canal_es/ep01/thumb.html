<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Bangers;src:url("../anim/fonts/Bangers-Regular.ttf")}@font-face{font-family:ComicNeue;src:url("../anim/fonts/ComicNeue-Bold.ttf")}html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../anim/lib.js"></script><script src="../anim/sets.js"></script><script src="../anim/cut/specs.js"></script><script src="../anim/cutout.js"></script>
<script>
// thumbnails, painted look: thumb.html?hyb=1&v=A|B|C
const X = document.getElementById('c').getContext('2d'), V = new URLSearchParams(location.search).get('v') || 'A';
function bigText(s, x, y, size, fill, rot = -.04, align = 'left') { X.save(); X.translate(x, y); X.rotate(rot); X.font = `${size}px Bangers`; X.textAlign = align; X.lineJoin = 'round';
  X.strokeStyle = '#1b1320'; X.lineWidth = size * .22; X.strokeText(s, 0, 0); X.strokeStyle = '#ffffff'; X.lineWidth = size * .08; X.strokeText(s, 0, 0); X.fillStyle = fill; X.fillText(s, 0, 0); X.restore(); }
function rimGlow(g, col, blur, fn) { g.save(); g.filter = `brightness(3) blur(${blur * .5}px)`; g.globalAlpha = .55; fn(g); g.restore(); fn(g); }   // soft halo underneath, then the character
function snapSpark(x, y, s) { X.save(); X.translate(x, y); X.strokeStyle = '#fde047'; X.lineCap = 'round'; X.lineWidth = 9 * s; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; X.beginPath(); X.moveTo(Math.cos(a) * 34 * s, Math.sin(a) * 34 * s); X.lineTo(Math.cos(a) * 80 * s, Math.sin(a) * 80 * s); X.stroke(); } X.restore(); }
window.render = () => {
  if (V === 'A') {   // ¿ELLA TAMBIÉN?: frozen street, the two of them in colour
    const cam = { cx: 1290, cy: 600, z: 1.55 }, st = stage(cam);
    st.wld(g => drawSet(g, 'street'));
    st.wld(g => { const fr = { still: 1, t: 0, blink: 0, s: .78, y: 930 };
      drawChar(g, 'ex3', { ...fr, x: 760, walk: 1, phase: .9, look: [10, 0], mouth: .2 }); drawChar(g, 'ex2', { ...fr, x: 980, walk: 1, phase: 2.4, flip: -1, look: [-10, 4], open: .4 }); propPot(g, 1330, 140, .8, .1); });
    st.col(g => rimGlow(g, 'rgba(255,240,200,.9)', 30, q => drawChar(q, 'valeria', { x: 1560, y: 980, s: .9, t: 0, look: [-18, 2], mouth: .8, lid: .45, brow: .4, hR: [170, -500], hL: [-40, -320] })));
    st.col(g => rimGlow(g, 'rgba(255,240,200,.9)', 30, q => drawChar(q, 'tu', { x: 1080, y: 1030, s: 1.0, t: 0, look: [18, -4], wide: 1, open: .5, brow: .9, sweat: 1, hL: [-120, -420], hR: [120, -420] })));
    st.col(g => drawPigeon(g, 1480, 640, .5, { tilt: -.15 }));
    compose2(X, st, { amt: 1 });
    const [sx, sy] = worldToScreen(cam, 1560 + 170 * .9 * .97, 980 - 500 * .9 * .97); snapSpark(sx + 10, sy - 30, 1.0);
    X.save(); X.globalAlpha = .6; const gr = X.createLinearGradient(0, 0, 0, 330); gr.addColorStop(0, '#0d0b12'); gr.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = gr; X.fillRect(0, 0, W, 330); X.restore();
    bigText('¿ELLA TAMBIÉN?', W / 2, 230, 230, '#fde047', -.03, 'center');
  } else if (V === 'B') {   // 1 APLAUSO: the clap freezes the hallway
    const cam = { cx: 1500, cy: 520, z: 1.45 }, st = stage(cam);
    st.wld(g => drawSet(g, 'hallway'));
    st.wld(g => { const fr = { still: 1, t: 0, blink: 0, s: .78, y: 930 };
      drawChar(g, 'ex5', { ...fr, x: 1180, hR: [150, -720], look: [12, -8], mouth: .4 });
      drawChar(g, 'nacho', { ...fr, x: 1880, rot: -.22, hx: -10, hy: 10, blink: 1, open: .95, hL: [-60, -610], hR: [40, -600] }); dropsSpray(g, 1845, 455, 18, 3, 1.3);
      propBall(g, 1290, 330, 46, .4); });
    const hp = { x: 1530, y: 980, s: .95, t: 0, mouth: 1, open: .7, wide: .9, brow: .9, armsFront: 1 }; const G = charGeom(CAST.tu, hp); [hp.hL, hp.hR] = POSE.clap(1, G);
    st.col(g => rimGlow(g, 'rgba(255,240,200,.9)', 30, q => drawChar(q, 'tu', hp)));
    compose2(X, st, { amt: 1 });
    const [cx, cy] = worldToScreen(cam, ...clapPoint('tu', hp));
    X.save(); for (let i = 0; i < 3; i++) { X.strokeStyle = `rgba(255,255,255,${.9 - i * .25})`; X.lineWidth = 14 - i * 3; X.beginPath(); X.arc(cx, cy, 110 + i * 70, 0, 7); X.stroke(); } X.restore();
    X.save(); X.globalAlpha = .55; const gr = X.createLinearGradient(0, 0, 900, 0); gr.addColorStop(0, '#0d0b12'); gr.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = gr; X.fillRect(0, 0, 900, H); X.restore();
    bigText('1', 90, 600, 460, '#fde047'); bigText('APLAUSO', 60, 880, 250, '#fde047');
  } else {   // C: Pepe in colour in the frozen park
    const cam = { cx: 1090, cy: 650, z: 2.4 }, st = stage(cam);
    st.wld(g => { drawSet(g, 'parkNight'); bench(g, 0); });
    st.wld(g => { drawChar(g, 'valeria', { x: 1240, y: 905, s: .78, t: 0, still: 1, sit: 1, look: [-6, 18], wide: .7, hL: [-40, -300], hR: [40, -300], armsFront: 1 });
      drawChar(g, 'tu', { x: 900, y: 905, s: .78, t: 0, still: 1, sit: 1, look: [10, 18], wide: .9, open: .4, hL: [-40, -300], hR: [40, -300], armsFront: 1 }); bench(g, 1); });
    st.col(g => rimGlow(g, 'rgba(255,230,140,1)', 40, q => drawPigeon(q, 1080, 792, .8, { flip: -1, front: 1, tilt: .15 })));
    compose2(X, st, { amt: 1 });
    bigText('¿ÉL TAMBIÉN?', W / 2, 220, 200, '#fde047', -.03, 'center');
  }
};
window.ready = Promise.all([document.fonts.load('70px Bangers'), document.fonts.load('70px ComicNeue'), window.CUT_READY || true]).then(() => true);
</script></body></html>
